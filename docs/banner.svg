<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="1" stop-color="#0d0b24"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.1" cy="0" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.95" cy="1" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#g1)"/>
  <rect width="1280" height="360" fill="url(#g2)"/>

  <g transform="translate(80 92)">
    <rect width="64" height="64" rx="18" fill="url(#neon)" filter="url(#glow)"/>
    <path d="M14 42l12-14 10 8 16-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="48" font-family="Space Grotesk, Inter, Segoe UI, sans-serif" font-size="48" font-weight="700" fill="#e7e9ff">Money<tspan fill="url(#neon)">twin</tspan></text>
  </g>
  <text x="80" y="220" font-family="Space Grotesk, Inter, Segoe UI, sans-serif" font-size="34" font-weight="600" fill="#e7e9ff">The digital twin of your money.</text>
  <text x="80" y="262" font-family="Inter, Segoe UI, sans-serif" font-size="20" fill="#8b90b8">AI categorisation · forecasts · what-if simulator · 100% local</text>

  <g transform="translate(860 70)" filter="url(#glow)">
    <rect x="0" y="0" width="340" height="220" rx="24" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="30" y="110" width="34" height="80" rx="6" fill="url(#bar)"/>
    <rect x="80" y="86" width="34" height="104" rx="6" fill="url(#bar)"/>
    <rect x="130" y="120" width="34" height="70" rx="6" fill="url(#bar)"/>
    <rect x="180" y="70" width="34" height="120" rx="6" fill="url(#bar)"/>
    <rect x="230" y="96" width="34" height="94" rx="6" fill="url(#bar)"/>
    <rect x="280" y="60" width="34" height="130" rx="6" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-dasharray="5 4"/>
    <text x="30" y="46" font-family="Inter, sans-serif" font-size="14" fill="#8b90b8">FORECAST · NEXT MONTH</text>
  </g>
</svg>
